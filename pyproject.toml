[project]
name = "threadline"
version = "0.1.0"
description = "Local-first journal entry management system"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Alexander Lockwood"}
]

dependencies = [
    # CLI
    "typer>=0.9.0",
    "rich>=13.0.0",

    # TUI
    "textual>=0.47.0",

    # Database
    "sqlite-vss>=0.1.2",

    # ML - Embeddings
    "sentence-transformers>=2.2.0",

    # ML - Classification (zero-shot)
    "transformers>=4.36.0",

    # ML - Theme extraction (Phase 3)
    # "bertopic>=0.16.0",

    # Parsing
    "python-frontmatter>=1.0.0",
    "dateparser>=1.2.0",

    # Config
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
# Full ML stack including theme extraction
ml-full = [
    "bertopic>=0.16.0",
    "umap-learn>=0.5.0",
    "hdbscan>=0.8.0",
    "scikit-learn>=1.0.0",
]

# Handwriting OCR
ocr = [
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
]

ocr-handwriting = [
    "transformers>=4.36.0",
]

# LLM integrations
llm = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "ollama>=0.1.0",
]

# Development
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
threadline = "threadline.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/threadline"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (require ML model loading)",
]
